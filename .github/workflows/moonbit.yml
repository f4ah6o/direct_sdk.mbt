name: MoonBit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | MOONBIT_INSTALL_VERSION="0.1.20260920" bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Cache MoonBit dependencies
        uses: actions/cache@v6
        with:
          path: |
            .mooncakes
            ~/.moon/registry/index
          key: moonbit-${{ runner.os }}-0.1.20260920-${{ hashFiles('moon.mod') }}
          restore-keys: |
            moonbit-${{ runner.os }}-0.1.20260920-

      - name: Update dependencies
        run: moon update

      - name: Check formatting
        run: moon fmt --check

      - name: Check all targets
        run: moon check --target all

      - name: Test all targets
        run: moon test --target all
